name: aegis
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/setup.ps1 first}
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--requirepass', '${REDIS_PASSWORD}', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run scripts/setup.ps1 first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/setup.ps1 first}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup.ps1 first}
      MFA_SECRET: ${MFA_SECRET:?Run scripts/setup.ps1 first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      TRUSTED_PROXY_IP: 172.29.247.10
      RECON_ALLOWED_HOSTS: ${RECON_ALLOWED_HOSTS:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [edge, data]
    healthcheck:
      test: [CMD, wget, '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  frontend:
    build: ./frontend
    networks: [edge]
    healthcheck:
      test: [CMD, node, '-e', 'fetch("http://127.0.0.1:3000/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        ipv4_address: 172.29.247.10
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.247.0/24
  data:
    internal: true
volumes:
  pgdata:
